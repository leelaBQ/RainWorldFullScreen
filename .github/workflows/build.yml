name: Build StayVisible

on:
  workflow_dispatch:
  push:
    paths:
      - "StayVisible.cs"
      - "StayVisible.csproj"
      - "NuGet.Config"
      - "assets/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build StayVisible.csproj -c Release

      - name: Pack Rain World mod
        shell: pwsh
        run: |
          $root = "StayVisible"
          New-Item -ItemType Directory -Force "$root\plugins" | Out-Null
          Copy-Item "assets\modinfo.json" "$root\modinfo.json"
          $dll = Get-ChildItem "bin" -Recurse -Filter "StayVisible.dll" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) { throw "StayVisible.dll not found" }
          Copy-Item $dll.FullName "$root\plugins\StayVisible.dll"
          Compress-Archive -Path $root -DestinationPath "StayVisible_v1.1.0.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: StayVisible_v1.1.0
          path: StayVisible_v1.1.0.zip
